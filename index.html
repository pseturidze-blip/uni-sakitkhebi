<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNI Mixed-Use — საკითხები</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Serif+Georgian:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEDEA; --paper:#F8F8F6; --ink:#1E2427; --muted:#646C71; --line:#CDD0CA; --soft:#E2E4DF;
  --accent:#A8281F; --accent-ink:#fff;
  --s-open:#7A8288; --s-discuss:#A86A12; --s-wait:#2C628C; --s-done:#2D7A4B;
  --s-open-bg:#E3E5E2; --s-discuss-bg:#F3E6CF; --s-wait-bg:#D9E6F0; --s-done-bg:#D8EBDD;
  --sans:"Noto Sans Georgian","Sylfaen","Segoe UI",system-ui,sans-serif;
  --serif:"Noto Serif Georgian","Sylfaen",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161A1C; --paper:#1F2427; --ink:#E6E8E5; --muted:#9AA2A6; --line:#343B3F; --soft:#2A3034;
  --accent:#E0574B; --accent-ink:#1A0A08;
  --s-open:#A3ABB0; --s-discuss:#E2A44A; --s-wait:#7DB4DC; --s-done:#6CC18E;
  --s-open-bg:#2B3134; --s-discuss-bg:#3A2E1A; --s-wait-bg:#1D3242; --s-done-bg:#1D3426;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#161A1C; --paper:#1F2427; --ink:#E6E8E5; --muted:#9AA2A6; --line:#343B3F; --soft:#2A3034;
  --accent:#E0574B; --accent-ink:#1A0A08;
  --s-open:#A3ABB0; --s-discuss:#E2A44A; --s-wait:#7DB4DC; --s-done:#6CC18E;
  --s-open-bg:#2B3134; --s-discuss-bg:#3A2E1A; --s-wait-bg:#1D3242; --s-done-bg:#1D3426;
  color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hide{display:none!important}
.cc{font-size:12.5px;color:var(--muted)}

/* gate */
.gate{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}
.gcard{max-width:420px}
.gcard h1{margin-bottom:24px}

/* header */
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 80px}
header.top{display:flex;align-items:center;gap:10px;position:relative}
h1{font:700 clamp(22px,3.6vw,32px)/1.2 var(--serif);margin:0;letter-spacing:-.01em}
header.top h1{flex:1;min-width:0}
.icon{border:1px solid var(--line);background:var(--paper);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;padding:0;font-size:16px;flex:none;overflow:hidden}
.icon img{width:100%;height:100%;object-fit:cover}
.menu{position:absolute;right:0;top:44px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:220px;z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.menu .em{font-size:13px;color:var(--muted);margin-bottom:8px;word-break:break-all}

/* status legend */
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13.5px;color:var(--muted);margin-top:14px}
.legend button{background:none;border:0;padding:2px 0;display:flex;gap:6px;align-items:center;color:inherit}
.legend button[aria-pressed="true"]{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:4px}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.sdot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* toolbar */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);margin:12px -20px 0;padding:12px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 120px;min-width:110px;padding:8px 12px;border:1px solid var(--line);background:var(--paper);border-radius:6px}
.filters{display:contents}
select.f{padding:8px 10px;border:1px solid var(--line);background:var(--paper);border-radius:6px;max-width:150px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:7px 12px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--paper);padding:7px 14px;border-radius:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:none}
.btn.sm{padding:3px 10px;font-size:13px}
.btn.big{padding:11px 22px;font-size:16px}
.btn.danger{color:var(--accent);border-color:transparent;background:none;margin-left:auto}
.btn:disabled{opacity:.6;cursor:default}
.fbtn{display:none}
#banner:not(:empty){margin-top:14px;padding:10px 14px;border-radius:6px;background:var(--s-discuss-bg);font-size:13.5px}

/* list */
.topic{margin-top:26px}
.topic h2{font:700 19px/1.3 var(--serif);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.topic h2 small{font:500 13px var(--sans);color:var(--muted)}
.rows{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.rsubs{grid-column:2/-1;display:flex;flex-direction:column;gap:1px;min-width:0;margin-top:1px}
.rs{font-size:12.5px;line-height:1.45;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:14px;position:relative}
.rs::before{content:'–';position:absolute;left:2px}
.rs.dn::before{content:'✓';color:var(--s-done);left:0}
.rs.dn span{text-decoration:line-through;opacity:.7}
.rsl{font-size:11px;font-weight:600;color:var(--muted);margin-top:4px;padding-left:14px}
.rmore{align-self:flex-start;border:0;background:none;padding:1px 0 1px 14px;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.lopts{display:flex;justify-content:flex-end;margin-top:12px;font-size:13px;color:var(--muted)}
.lopts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.lopts input{accent-color:var(--accent)}
.donesec{margin-top:34px;border-top:1px solid var(--line);padding-top:14px}
.dsh{border:0;background:none;padding:2px 0;font:700 17px/1.3 var(--serif);color:var(--muted);display:flex;gap:8px;align-items:center}
.donesec .topic{margin-top:16px}
.donesec .topic h2{font-size:16px;color:var(--muted)}
.row:hover{background:var(--soft)}
.num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13.5px}
.ttl{font-weight:600}
.meta{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;padding:1px 8px;border-radius:20px;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.pn{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:11.5px;font-weight:700;color:var(--paper);flex:none}
.pn.p1{background:var(--accent)}.pn.p2{background:var(--s-discuss)}.pn.p3{background:var(--s-wait)}.pn.p4{background:var(--s-open)}
.pn.p0{border:1px dashed var(--line);color:var(--muted);font-weight:500}
.empty{margin:40px 0;padding:30px;border:1px dashed var(--line);border-radius:8px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 12px}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;margin-top:22px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--soft);border-radius:8px;padding:10px;min-height:120px}
.col h3{margin:2px 4px 10px;font-size:14px;display:flex;gap:8px;align-items:center}
.col h3 small{color:var(--muted);font-weight:500}
.col.over{outline:2px dashed var(--accent);outline-offset:-4px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:9px 11px;margin-bottom:8px;cursor:pointer}
.card .ct{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.card .chips{margin-top:6px}
.card{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.card.lift{opacity:.35}
.card.ghost{position:fixed;left:0;top:0;z-index:50;margin:0;pointer-events:none;box-shadow:0 10px 28px rgba(0,0,0,.25);transform-origin:center}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,16,.38);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--paper);z-index:21;transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;border-left:1px solid var(--line);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.drawer.on{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
.dh{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line)}
.dht{font:700 16px var(--serif)}
.dh .x{margin-left:auto;border:0;background:none;font-size:24px;line-height:1;padding:2px 8px}
.db{overflow-y:auto;padding:18px 20px 30px;flex:1}
.vhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.vhead>div{flex:1;min-width:0}
.vtitle{font:700 20px/1.3 var(--serif)}
.vtopic{font-size:13px;color:var(--muted);margin-top:2px}
.vtext{white-space:pre-wrap;font-size:14.5px;margin:0 0 14px}
.notebox{background:var(--bg);border-radius:6px;padding:10px 12px;margin-bottom:16px}
.notebox .vtext{margin:0}
.field{margin-bottom:16px}
.field label,.flabel{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px}
.field textarea{resize:vertical;min-height:70px;line-height:1.5}
.field .big{font:700 19px/1.3 var(--serif)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:4px 12px 4px 8px;font-size:13px;display:flex;gap:6px;align-items:center}
.opts button[aria-pressed="true"]{font-weight:600;border-color:var(--c,var(--ink));background:var(--cb,var(--soft));color:var(--c,var(--ink))}
.people{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.people .chip{font-size:13px;padding:3px 4px 3px 10px;display:inline-flex;gap:2px;align-items:center}
.people .chip button{border:0;background:none;padding:0 5px;color:var(--muted);font-size:15px;line-height:1}
input.inl{border:1px dashed var(--line);background:none;border-radius:20px;padding:3px 10px;font-size:13px;width:130px}
input.inl.wide{width:100%;border-radius:6px;padding:7px 10px;margin-top:8px}
.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:18px}
.sec h4{margin:0 0 8px;font:700 15px var(--serif)}
.sec h4 small{font:500 13px var(--sans);color:var(--muted)}
.subt{border:0;background:none;padding:0;font:700 15px var(--serif);display:flex;gap:8px;align-items:center}
.subt span{font:400 13px var(--sans);color:var(--muted)}
.sublist{list-style:none;margin:8px 0 0;padding:0}
.sublist li{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--soft)}
.sublist li.done span{text-decoration:line-through;color:var(--muted)}
.sublist input{margin-top:5px;accent-color:var(--accent)}
.sublist span{flex:1;font-size:14px}
.sublist .rm{border:0;background:none;color:var(--muted);padding:0 4px}
.cm{padding:9px 0;border-bottom:1px solid var(--soft)}
.cm .who{font-size:12.5px;color:var(--muted);display:flex;gap:8px}
.cm .who b{color:var(--ink);font-weight:600}
.cm .who button{margin-left:auto;border:0;background:none;color:var(--muted);font-size:12px}
.cm p{margin:3px 0 0;white-space:pre-wrap;font-size:14px}
.cmnew textarea{width:100%;min-height:64px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;resize:vertical;margin-top:10px}
.cmnew .r{display:flex;justify-content:flex-end;margin-top:6px}
.editbar{display:flex;gap:8px}
.foot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:14px;margin-top:22px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13.5px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.toast.err{background:#B3261E;color:#fff}

/* tabs */
.tabs{display:flex;gap:22px;margin-top:12px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 0;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* options (ვარიანტები) */
.oc{font-size:12px;color:var(--muted);white-space:nowrap}
.oc.ok{color:var(--s-done);font-weight:600}
.opgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:4px}
.opc{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0;text-align:left;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.opc .th{aspect-ratio:4/3;background:var(--soft);display:grid;place-items:center;color:var(--muted);font-size:12.5px;overflow:hidden}
.opc .th img{width:100%;height:100%;object-fit:cover}
.opc .ob{padding:7px 9px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.opc .on{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opc .os{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opc.chosen{border-color:var(--s-done);box-shadow:0 0 0 1px var(--s-done)}
.opc.rej{opacity:.55}
.opc.rej .on{text-decoration:line-through}
.stb{display:inline-block;font-size:11.5px;font-weight:600;padding:0 7px;border-radius:20px;background:var(--s-open-bg);color:var(--s-open);width:max-content}
.stb.chosen{background:var(--s-done-bg);color:var(--s-done)}
.stb.rej{background:var(--soft);color:var(--muted)}
.addrow{display:flex;gap:8px;margin-top:10px}
.back{border:0;background:none;padding:2px 0;color:var(--muted);font-size:13.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:0 0 14px}
.kv dt{color:var(--muted);font-size:13px}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.chosenby{font-size:12.5px;color:var(--s-done);margin:-6px 0 14px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.lnk{display:inline-flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;background:var(--bg);color:var(--ink);text-decoration:none;font-size:13px;max-width:100%}
.lnk:hover{border-color:var(--ink)}
.lnk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.lnk img{width:160px;height:110px;object-fit:cover;border-radius:4px;background:var(--soft)}
.lrow{display:flex;gap:6px;margin-bottom:6px}
.lrow input{flex:1;min-width:0}
.lrow input.lb{flex:0 1 140px}
.lrow button{border:0;background:none;color:var(--muted);font-size:18px;padding:0 6px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin:0 0 14px}
.gal button{border:0;padding:0;background:var(--soft);border-radius:6px;overflow:hidden;aspect-ratio:1}
.gal img,.fthumb img{width:100%;height:100%;object-fit:cover;display:block}
img.missing{visibility:hidden}
.opc .th{position:relative}.opc .nf{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:0 6px;border-radius:10px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin-bottom:8px}
.fthumb{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.fthumb .rmf{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1;padding:0}
.fthumb.up{display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-size:11px;color:var(--muted)}
.fthumb.up span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fthumb .pb{height:4px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}
.fthumb .pb i{display:block;height:100%;background:var(--accent);transition:width .2s}
.fthumb.err{color:var(--accent)}
.drop{display:flex;align-items:center;justify-content:center;gap:6px;border:1px dashed var(--line);border-radius:6px;padding:12px;color:var(--muted);font-size:13.5px;cursor:pointer;background:var(--bg)}
.drop.over{border-color:var(--accent);color:var(--ink)}
.viewer{position:fixed;inset:0;z-index:60;background:#0B0D0F;color:#fff}
.viewer[hidden]{display:none}
.vstage{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;touch-action:none;cursor:zoom-in}
.viewer.zoomed .vstage{cursor:grab}
.vstage img{max-width:100vw;max-height:100vh;object-fit:contain;transform-origin:center;user-select:none;-webkit-user-drag:none}
.viewer.busy .vstage::after{content:'';position:absolute;width:28px;height:28px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vbtn{position:absolute;border:0;background:rgba(0,0,0,.45);color:#fff;width:44px;height:44px;border-radius:50%;font-size:26px;line-height:1;display:grid;place-items:center;text-decoration:none;padding:0}
.vbtn[hidden]{display:none}
.vx{top:calc(12px + env(safe-area-inset-top,0px));right:12px}
.vopen{top:calc(12px + env(safe-area-inset-top,0px));right:64px;font-size:18px}
.vprev{left:12px;top:50%;transform:translateY(-50%)}.vnext{right:12px;top:50%;transform:translateY(-50%)}
.vcap{position:absolute;left:0;right:0;bottom:0;padding:10px 70px calc(12px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;background:linear-gradient(transparent,rgba(0,0,0,.6));pointer-events:none}
@media (max-width:700px){.vprev,.vnext{display:none}}
.cmp{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.cmp[hidden]{display:none}
.cmph{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line);min-width:0}
.cmph b{font:700 17px var(--serif);flex:none}.cmph .cc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cmph .x{margin-left:auto;border:0;background:none;font-size:26px;line-height:1;padding:2px 8px;flex:none}
.cmpchips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px}
.cmpchips button{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:3px 12px;font-size:13px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmpchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cmpbody{flex:1;overflow:auto;padding:0 20px 24px}
.cmpgrid{display:grid;grid-template-columns:repeat(var(--n),minmax(220px,420px));column-gap:12px}
.cc2{background:var(--paper);border-left:1px solid var(--line);border-right:1px solid var(--line);padding:8px 12px;min-width:0;overflow-wrap:anywhere;font-size:14px}
.cc2.r0{border-top:1px solid var(--line);border-radius:8px 8px 0 0;padding:0;overflow:hidden}
.cc2.last{border-bottom:1px solid var(--line);border-radius:0 0 8px 8px;padding-bottom:12px}
.cc2 .cl{display:block;font-size:11.5px;color:var(--muted);margin-bottom:1px}

<body>
<div class="gate" id="gate"><div class="gcard"><p class="cc">იტვირთება…</p></div></div>

<div class="wrap hide" id="app">
  <header class="top">
    <h1>UNI Mixed-Use</h1>
    <button class="icon" id="themeBtn"></button>
    <button class="icon" id="meBtn" aria-label="ანგარიში" aria-haspopup="true"></button>
    <div class="menu hide" id="meMenu"><div class="em" id="meEmail"></div><div class="editbar"><button class="btn sm" id="expBtn2">CSV ჩამოტვირთვა</button><button class="btn sm" id="signOut">გასვლა</button></div></div>
  </header>
  <nav class="tabs" role="tablist" aria-label="განყოფილება">
    <button role="tab" data-tab="issues">საკითხები</button><button role="tab" data-tab="cat">მასალების კატალოგი</button>
  </nav>
  <div id="banner"></div>

  <div id="tabCat" class="hide"><div class="empty">მზადდება</div></div>

  <div id="tabIssues">
  <div class="legend" id="legend"></div>

  <div class="bar">
    <input class="search" id="q" type="search" placeholder="ძებნა" aria-label="ძებნა">
    <button class="btn fbtn" id="fBtn" aria-expanded="false" aria-controls="filters">ფილტრი<span id="fCount"></span></button>
    <div class="filters" id="filters">
      <select class="f" id="fTopic" aria-label="თემა"></select>
      <select class="f" id="fPerson" aria-label="პირი"></select>
      <select class="f" id="fPrio" aria-label="პრიორიტეტი"></select>
    </div>
    <div class="seg" role="group" aria-label="ხედი">
      <button data-v="topic">თემა</button><button data-v="prio">პრიორიტეტი</button><button data-v="board">დაფა</button>
    </div>
    <button class="btn ghost" id="expBtn" title="ჩამოტვირთვა (CSV)">CSV</button>
    <button class="btn primary" id="addBtn">+ ახალი</button>
  </div>

  <div class="lopts" id="lopts"></div>
  <main id="view"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="საკითხი" aria-hidden="true"></aside>
<div class="cmp" id="cmp" hidden role="dialog" aria-modal="true" aria-label="შედარება"></div>
<div class="toast" id="toast" role="status"></div>
<datalist id="dlTopics"></datalist>
<datalist id="dlPeople"></datalist>
<input type="file" id="importFile" accept=".json,application/json" class="hide">

<script type="module">
import { firebaseConfig } from './firebase-config.js';
import { initMedia, uploadImage, MAX_INPUT, cachedThumb, hydrateThumbs, openViewer } from './media.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signInWithRedirect, signOut } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
import { getFirestore, collection, doc, onSnapshot, updateDoc, deleteDoc, addDoc, setDoc, writeBatch, runTransaction, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

/* ---------- constants ---------- */
const ST=[['open','ღია'],['discuss','განხილვაში'],['wait','მოლოდინში'],['done','გადაწყვეტილია']];
const STL=Object.fromEntries(ST);
const PR=[[1,'დაწყებამდე'],[2,'კარკასი'],[3,'მოპირკეთება'],[4,'ექსპლუატაცია']];
const PRL=Object.fromEntries(PR);
const PRF={1:'მშენებლობის დაწყებამდე',2:'კარკასის ეტაპზე',3:'მოპირკეთების ეტაპზე',4:'ექსპლუატაციამდე'};
const TOPIC_ORDER=['ფასადი','ინტერიერი','ლიფტი','განათება','გამწვანება','კეთილმოწყობა','პანდუსი','პარკინგი','საინჟინრო','მართვა და სერვისი','სხვა'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tms=v=>v&&typeof v.toMillis==='function'?v.toMillis():(typeof v==='number'?v:0);

let savedTab='issues',savedSubs=true;try{savedSubs=localStorage.getItem('uni-subs')!=='0'}catch(e){}
savedTab='issues';try{savedTab=localStorage.getItem('uni-tab')==='cat'?'cat':'issues'}catch(e){}
const S={issues:new Map(),comments:[],options:[],choices:new Map(),tab:savedTab,showSubs:savedSubs,doneOpen:new Set(),doneSec:false,opt:null,optEdit:false,errs:{},view:'topic',q:'',topic:'',person:'',prio:'',status:'',open:null,edit:false,subsOpen:false,newTopic:'',pending:null,loaded:false,user:null};
let auth,db,unsubs=[];

/* ---------- theme ---------- */
const THEMES={auto:['◐','ავტო'],light:['☀','ღია'],dark:['☾','მუქი']};
let theme='auto';try{theme=localStorage.getItem('uni-theme')||'auto'}catch(e){}
if(!THEMES[theme])theme='auto';
function applyTheme(){
  const r=document.documentElement;theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',theme);
  const b=$('#themeBtn');b.textContent=THEMES[theme][0];b.title='თემა: '+THEMES[theme][1];b.setAttribute('aria-label',b.title)}
applyTheme();

/* ---------- gate / auth ---------- */
function gate(kind,extra){
  $('#app').classList.add('hide');closeIssue(true);
  const g=$('#gate');g.classList.remove('hide');
  const em=S.user?esc(S.user.email):'';
  const body={
    config:`<p>Firebase-ის პარამეტრები არ არის ჩასმული.</p><p class="cc">firebase-config.js — იხ. SETUP.md</p>`,
    loading:`<p class="cc">იტვირთება…</p>`,
    signin:`<button class="btn primary big" id="signIn">Google-ით შესვლა</button>`,
    denied:`<p><b>${em}</b></p><p>ამ ანგარიშს წვდომა არ აქვს.</p><button class="btn" id="signOut">სხვა ანგარიშით შესვლა</button>`,
    error:`<p>მონაცემები ვერ ჩაიტვირთა${extra?` (${esc(extra)})`:''}.</p><button class="btn" id="reload">თავიდან</button>`
  }[kind];
  g.innerHTML=`<div class="gcard"><h1>UNI Mixed-Use — საკითხები</h1>${body}</div>`;
}
function showApp(){
  $('#gate').classList.add('hide');$('#app').classList.remove('hide');
  const u=S.user,b=$('#meBtn');
  b.innerHTML=u.photoURL?`<img src="${esc(u.photoURL)}" alt="" referrerpolicy="no-referrer">`:esc((u.displayName||u.email||'?').trim()[0].toUpperCase());
  $('#meEmail').textContent=u.email;
}
async function doSignIn(){
  const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  try{await signInWithPopup(auth,p)}
  catch(e){
    if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')await signInWithRedirect(auth,p);
    else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')toast('შესვლა ვერ მოხერხდა ('+e.code+')');
  }
}

/* ---------- data ---------- */
function showErrs(){$('#banner').textContent=Object.values(S.errs).join(' ')}
function listenErr(key,label){return err=>{console.error(err);S.errs[key]=`${label} ვერ ჩაიტვირთა (${err.code||'error'}). გადატვირთეთ გვერდი.`;showErrs()}}
function listenOk(key){if(S.errs[key]){delete S.errs[key];showErrs()}}
function stopListeners(){unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];S.errs={};showErrs();S.issues=new Map();S.comments=[];S.options=[];S.choices=new Map();S.loaded=false}
function startListeners(){
  let offT=null;
  unsubs.push(onSnapshot(collection(db,'issues'),{includeMetadataChanges:true},snap=>{
    if(snap.metadata.fromCache){if(!offT)offT=setTimeout(()=>{S.errs.net='სერვერთან კავშირი არ არის. შეამოწმეთ ინტერნეტი ან გადატვირთეთ გვერდი.';showErrs()},10000)}
    else{clearTimeout(offT);offT=null;if(S.errs.net){delete S.errs.net;showErrs()}}
    const m=new Map();snap.docs.forEach(d=>m.set(d.id,{...d.data({serverTimestamps:'estimate'}),id:d.id}));
    S.issues=m;if(!S.loaded){S.loaded=true;showApp()}render();
  },err=>{S.loaded=false;gate(err.code==='permission-denied'?'denied':'error',err.code)}));
  unsubs.push(onSnapshot(collection(db,'comments'),snap=>{
    S.comments=snap.docs.map(d=>({...d.data({serverTimestamps:'estimate'}),id:d.id}));listenOk('c');if(S.loaded)render();
  },listenErr('c','კომენტარები')));
  unsubs.push(onSnapshot(collection(db,'options'),snap=>{
    S.options=snap.docs.map(d=>({...d.data({serverTimestamps:'estimate'}),id:d.id}));listenOk('o');if(S.loaded)render();
  },listenErr('o','ვარიანტები')));
  unsubs.push(onSnapshot(collection(db,'choices'),snap=>{
    const m=new Map();snap.docs.forEach(d=>m.set(d.id,d.data({serverTimestamps:'estimate'})));S.choices=m;listenOk('ch');if(S.loaded)render();
  },listenErr('ch','არჩევანი')));
}
const stamp=()=>({updatedAt:serverTimestamp(),updatedBy:S.user.email});
const ERR={'permission-denied':'წვდომა აკრძალულია','unavailable':'სერვერთან კავშირი არ არის','deadline-exceeded':'სერვერი არ პასუხობს','not-found':'ჩანაწერი ვერ მოიძებნა','resource-exhausted':'უფასო ლიმიტი ამოიწურა','failed-precondition':'სერვერის პირობა არ დაკმაყოფილდა'};
const errText=e=>{const c=e&&e.code?String(e.code).replace(/^firestore\//,''):'';return (ERR[c]?ERR[c]+' ':'')+'('+(c||(e&&e.message)||'error')+')'};
function writeErr(e){toast('ვერ შეინახა: '+errText(e),'err');console.error(e)}
/* disable a button and show "sending…" while a save runs */
const BUSY=new Set();
function markBusy(){BUSY.forEach(id=>{const b=document.getElementById(id);if(b&&b.dataset.t===undefined){b.dataset.t=b.textContent;b.disabled=true;b.textContent='იგზავნება…'}})}
async function busy(id,fn){if(BUSY.has(id))return;BUSY.add(id);markBusy();
  try{return await fn()}finally{BUSY.delete(id);const b=document.getElementById(id);if(b&&b.dataset.t!==undefined){b.disabled=false;b.textContent=b.dataset.t;delete b.dataset.t}}}
/* a save the server confirmed must show up in the live list; if not, the live connection is stuck */
function expectSeen(coll,id){setTimeout(()=>{const ok=coll==='issues'?S.issues.has(id):S.comments.some(c=>c.id===id);
  if(!ok&&S.loaded){S.errs.stale='ცვლილება შენახულია, მაგრამ სია არ განახლდა. გადატვირთეთ გვერდი (Ctrl+F5).';showErrs()}},8000)}
/* shows the change at once; reverts it on screen if the server refuses */
function save(id,patch,ok='შენახულია'){
  const i=S.issues.get(id),prev={};if(i){Object.keys(patch).forEach(k=>prev[k]=i[k]);Object.assign(i,patch)}
  return updateDoc(doc(db,'issues',id),{...patch,...stamp()}).then(()=>{if(ok)toast(ok)},e=>{
    const j=S.issues.get(id);if(j)Object.keys(prev).forEach(k=>{if(j[k]===patch[k])j[k]=prev[k]});render();writeErr(e)})}
async function createIssue(data){
  const ref=doc(collection(db,'issues')),cref=doc(db,'meta','counter');
  const localMax=Math.max(0,...all().map(i=>i.n||0));
  await runTransaction(db,async tx=>{
    const c=await tx.get(cref);
    const n=Math.max(c.exists()?(c.data().n||0):0,localMax)+1;
    tx.set(cref,{n});tx.set(ref,{...data,n,createdAt:Date.now(),...stamp()});
  });
  return ref.id;
}
async function removeIssue(id){
  const os=optsOf(id);
  await commitDeletes([doc(db,'issues',id),...S.comments.filter(c=>c.issue===id).map(c=>doc(db,'comments',c.id)),
    ...os.map(o=>doc(db,'options',o.id)),...(S.choices.has(id)?[doc(db,'choices',id)]:[]),...os.flatMap(o=>fileRefs(o.files))]);
}

/* ---------- options (ვარიანტები) ---------- */
const OT=[['drawing','ნახაზი'],['photo','ფოტო'],['render','რენდერი'],['sample','ნიმუში'],['pdf','PDF']];
const OTL=Object.fromEntries(OT);
const OS={consider:'განსახილველი',chosen:'არჩეული',rej:'უარყოფილი'};
const OSC={consider:'discuss',chosen:'done',rej:'open'};
const optsOf=id=>S.options.filter(o=>o.issue===id).sort((a,b)=>tms(a.createdAt)-tms(b.createdAt)||String(a.name).localeCompare(String(b.name),'ka'));
const curOpt=()=>S.options.find(o=>o.id===S.opt);
const fileRefs=fs=>(fs||[]).flatMap(f=>f&&f.id?[doc(db,'images',f.id),doc(db,'thumbs',f.id)]:[]);
async function commitDeletes(refs){for(let k=0;k<refs.length;k+=400){const b=writeBatch(db);refs.slice(k,k+400).forEach(r=>b.delete(r));await b.commit()}}
const imgTag=id=>{const u=cachedThumb(id);return u?`<img src="${u}" alt="">`:`<img data-thumb="${esc(id)}" alt="">`};
const fileMeta=f=>({id:f.id,name:f.name,w:f.w,h:f.h,size:f.size,mime:f.mime});
const optState=o=>S.choices.get(o.issue)?.option===o.id?'chosen':o.rejected?'rej':'consider';
async function saveOption(id,data){
  if(!id){const ref=doc(collection(db,'options'));await setDoc(ref,{files:[],...data,rejected:false,createdAt:serverTimestamp(),createdBy:S.user.email,...stamp()});return ref.id}
  await updateDoc(doc(db,'options',id),{...data,...stamp()});return id}
function setOptState(o,st){
  const b=writeBatch(db),was=optState(o);if(was===st)return;
  if(st==='chosen')b.set(doc(db,'choices',o.issue),{option:o.id,by:S.user.email,byName:S.user.displayName||S.user.email,at:serverTimestamp()});
  else if(was==='chosen')b.delete(doc(db,'choices',o.issue));
  const rej=st==='rej';if(!!o.rejected!==rej)b.update(doc(db,'options',o.id),{rejected:rej,...stamp()});
  b.commit().then(()=>toast('შენახულია'),writeErr);
}
async function deleteOption(o){
  await commitDeletes([doc(db,'options',o.id),...(S.choices.get(o.issue)?.option===o.id?[doc(db,'choices',o.issue)]:[]),...fileRefs(o.files)]);
}

/* ---------- links ---------- */
function normUrl(u){u=String(u||'').trim();if(!u)return '';if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;
  try{const x=new URL(u);return /^https?:$/.test(x.protocol)&&x.hostname.includes('.')?x.href:null}catch(e){return null}}
function driveId(u){if(!/^https:\/\/(drive|docs)\.google\.com\//.test(u))return null;
  const m=u.match(/\/d\/([\w-]{20,})/)||u.match(/[?&]id=([\w-]{20,})/);return m?m[1]:null}
function linkLabel(l){if(l.label)return l.label;try{const h=new URL(l.url).hostname.replace(/^www\./,'');return /(drive|docs)\.google\.com$/.test(h)?'Google Drive':h}catch(e){return l.url}}
function linksHTML(ls){ls=(ls||[]).filter(l=>l&&l.url);if(!ls.length)return '';
  return `<div class="links">${ls.map(l=>{const id=driveId(l.url);
    return `<a class="lnk" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${id?`<img src="https://drive.google.com/thumbnail?id=${esc(id)}&sz=w320" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}<span>↗ ${esc(linkLabel(l))}</span></a>`}).join('')}</div>`}

function addComment(){
  const inp=$('#newCm');const text=(inp.value||'').trim();if(!text)return;const u=S.user,issue=S.open;
  busy('addCm',()=>addDoc(collection(db,'comments'),{issue,text,authorUid:u.uid,authorEmail:u.email,authorName:u.displayName||u.email,ts:serverTimestamp()})
    .then(ref=>{const el=$('#newCm');if(el&&S.open===issue&&el.value.trim()===text)el.value='';toast('კომენტარი გაიგზავნა');expectSeen('comments',ref.id)},writeErr));
}

/* position + summary → note (only when both exist the summary keeps its label) */
const mergeNote=(p,s)=>{p=p||'';s=s||'';return p&&s?p+'\n\nშეჯამება: '+s:(p||s)};
async function importJson(file){
  let arr;try{arr=JSON.parse(await file.text())}catch(e){toast('JSON ფაილი ვერ წაიკითხა.');return}
  if(!Array.isArray(arr)){toast('ფაილში საკითხების სია არ არის.');return}
  const b=writeBatch(db);let max=0,count=0;
  arr.forEach((x,ix)=>{
    if(!x||!x.id||!x.title)return;
    const d={
      n:Number.isInteger(x.n)?x.n:ix+1,
      topic:String(x.topic||'სხვა'),title:String(x.title),desc:String(x.desc||''),
      note:mergeNote(x.position,x.summary),
      status:STL[x.status]?x.status:'open',
      priority:[1,2,3,4].includes(x.priority)?x.priority:null,
      people:Array.isArray(x.people)?x.people.map(String):[],
      subs:Array.isArray(x.subs)?x.subs.map(s=>({t:String(s.t||''),done:!!s.done})):[],
      orig:String(x.orig||''),
      legacy:{position:String(x.position||''),summary:String(x.summary||'')},
      createdAt:typeof x.createdAt==='number'?x.createdAt:Date.now(),
      ...stamp()
    };
    max=Math.max(max,d.n);count++;b.set(doc(db,'issues',String(x.id)),d);
  });
  if(!count){toast('ფაილში საკითხები ვერ მოიძებნა.');return}
  b.set(doc(db,'meta','counter'),{n:max});
  try{await b.commit();toast(`იმპორტირებულია ${count} საკითხი`)}catch(e){writeErr(e)}
}

/* ---------- helpers ---------- */
const all=()=>[...S.issues.values()];
function topicsList(){const t=new Set(all().map(i=>i.topic||'სხვა'));return [...TOPIC_ORDER.filter(x=>t.has(x)),...[...t].filter(x=>!TOPIC_ORDER.includes(x)).sort((a,b)=>a.localeCompare(b,'ka'))]}
function peopleList(){const p=new Set();all().forEach(i=>(i.people||[]).forEach(x=>p.add(x)));return [...p].sort((a,b)=>a.localeCompare(b,'ka'))}
function commentsOf(id){return S.comments.filter(c=>c.issue===id).sort((a,b)=>tms(a.ts)-tms(b.ts))}
function matches(i){
  if(S.topic&&(i.topic||'სხვა')!==S.topic)return false;
  if(S.status&&i.status!==S.status)return false;

function optValues(){const v={};document.querySelectorAll('#drawer [data-ok]').forEach(el=>v[el.dataset.ok]=el.value.trim());
  v.links=[];let bad=false;
  document.querySelectorAll('#links .lrow').forEach(r=>{const raw=r.querySelector('.lu').value,u=normUrl(raw),lb=r.querySelector('.lb').value.trim();
    if(u===null){bad=true;r.querySelector('.lu').setAttribute('aria-invalid','true')}else if(u)v.links.push({url:u,label:lb})});
  return bad?null:v}
function optDirty(){if(S.ef&&(S.ef.added.length||S.ef.removed.length||uploading()))return true;const v=optValues();if(!v)return true;const o=S.opt==='__new__'?{type:'photo',links:[]}:curOpt();if(!o)return false;
  return ['name','type','note','supplier','price'].some(k=>(o[k]||'')!==v[k])||JSON.stringify((o.links||[]).map(l=>[l.url,l.label||'']))!==JSON.stringify(v.links.map(l=>[l.url,l.label]))}
async function saveOpt(){
  const v=optValues();if(!v){toast('ბმული არასწორია.');return}
  if(!v.name){toast('სახელი ცარიელია.');$('#o_name').focus();return}
  if(uploading()){toast('სურათები იტვირთება…');return}
  const isNew=S.opt==='__new__',ef=S.ef;if(ef)v.files=ef.files.map(fileMeta);
  await busy('optSave',async()=>{
    try{const id=await saveOption(isNew?null:S.opt,isNew?{issue:S.open,...v}:v);S.ef=null;S.optPending=id;S.opt=id;S.optEdit=false;renderDrawer(true);toast(isNew?'ვარიანტი დაემატა':'შენახულია');
      if(ef&&ef.removed.length)commitDeletes(fileRefs(ef.removed)).catch(e=>console.error(e))}
    catch(e){writeErr(e)}})}
function leaveOpt(){if(S.optEdit&&optDirty()&&!confirm('გავაუქმოთ ცვლილებები?'))return;
  if(S.optEdit)discardEf();
  if(S.optEdit&&S.opt!=='__new__'){S.optEdit=false}else{S.opt=null;S.optEdit=false}
  renderDrawer(true)}
function editHTML(i){
  const isNew=!i;i=i||{title:'',topic:S.newTopic,desc:'',note:''};
  return `<div class="dh">${isNew?'<b class="dht">ახალი საკითხი</b>':`<span class="num">№ ${i.n||''}</span>`}<button class="x" aria-label="დახურვა">×</button></div>
  <div class="db">
    <div class="field"><label for="e_title">სათაური</label><input id="e_title" class="big" data-k="title" value="${esc(i.title)}"></div>
    <div class="field"><label for="e_topic">თემა</label><input id="e_topic" data-k="topic" list="dlTopics" value="${esc(i.topic)}"></div>
    <div class="field"><label for="e_desc">აღწერა</label><textarea id="e_desc" data-k="desc">${esc(i.desc)}</textarea></div>
    <div class="field"><label for="e_note">შენიშვნა</label><textarea id="e_note" data-k="note" rows="5">${esc(i.note)}</textarea></div>
    <div class="editbar"><button class="btn primary" id="saveEdit">შენახვა</button><button class="btn" id="cancelEdit">გაუქმება</button></div>
  </div>`;
}
function renderDrawer(force){
  const D=$('#drawer');if(!S.open)return;
  if(S.open==='__new__'){if(force)D.innerHTML=editHTML(null);return}
  const i=cur();
  if(!i){if(S.pending===S.open)return;closeIssue(true);if(!force)toast('საკითხი წაიშალა');return}
  if((S.edit||S.optEdit)&&!force)return;
  let o=null;
  if(S.opt&&S.opt!=='__new__'){o=curOpt();if(!o){if(S.optPending===S.opt)return;S.opt=null;S.optEdit=false;toast('ვარიანტი წაიშალა')}}
  const keep={};['newCm','newPerson','newSub'].forEach(k=>{const el=document.getElementById(k);if(el)keep[k]=el.value});
  const ae=document.activeElement,fid=ae&&D.contains(ae)?ae.id:'',sc=D.querySelector('.db')?.scrollTop||0;
  D.innerHTML=S.edit?editHTML(i):S.opt?(S.optEdit?optEditHTML(i,o):optViewHTML(i,o)):viewHTML(i);
  if(!force){
    Object.entries(keep).forEach(([k,v])=>{const el=document.getElementById(k);if(el)el.value=v});
    const b=D.querySelector('.db');if(b)b.scrollTop=sc;
    if(fid){const el=document.getElementById(fid);if(el)el.focus()}
  }
  markBusy();hydrateThumbs(D);
}
function showDrawer(){const D=$('#drawer');D.classList.add('on');$('#scrim').classList.add('on');D.setAttribute('aria-hidden','false')}
function openIssue(id){S.open=id;S.edit=false;S.subsOpen=false;S.opt=null;S.optEdit=false;renderDrawer(true);showDrawer();setTimeout(()=>$('#drawer .x')?.focus(),50)}
function newIssue(){S.open='__new__';S.edit=true;S.newTopic=S.topic||'';renderDrawer(true);showDrawer();$('#e_title')?.focus({preventScroll:true})}
function closeIssue(force){
  if(!force&&(S.edit&&isDirty()||S.optEdit&&optDirty())&&!confirm('შეუნახავი ცვლილებები დაიკარგება. დავხუროთ?'))return;
  if(S.optEdit)discardEf();
  if(S.cmp)closeCmp();
  S.open=null;S.edit=false;S.pending=null;S.opt=null;S.optEdit=false;S.optPending=null;const D=$('#drawer');D.classList.remove('on');$('#scrim').classList.remove('on');D.setAttribute('aria-hidden','true')}
function editValues(){const o={};document.querySelectorAll('#drawer [data-k]').forEach(el=>o[el.dataset.k]=el.value.trim());return o}
function isDirty(){const v=editValues(),i=S.open==='__new__'?{topic:S.newTopic}:cur();if(!i)return false;return Object.keys(v).some(k=>(i[k]||'')!==v[k])}
function savePatch(patch){const i=cur();if(!i)return;save(i.id,patch);render()}
async function saveEdit(){
  const v=editValues();if(!v.title){toast('სათაური ცარიელია.');$('#e_title').focus();return}
  if(!v.topic)v.topic='სხვა';
  if(S.open==='__new__'){
    await busy('saveEdit',async()=>{
      try{const id=await createIssue({...v,status:'open',priority:null,people:[],subs:[],orig:''});
        S.pending=id;S.open=id;S.edit=false;S.subsOpen=false;renderDrawer(true);toast('საკითხი დაემატა');expectSeen('issues',id)}
      catch(e){writeErr(e)}});
    return}
  const i=cur();if(!i)return;const patch={};Object.keys(v).forEach(k=>{if((i[k]||'')!==v[k])patch[k]=v[k]});
  S.edit=false;if(Object.keys(patch).length)savePatch(patch);renderDrawer(true)}
function cancelEdit(){
  if(isDirty()&&!confirm('გავაუქმოთ ცვლილებები?'))return;
  if(S.open==='__new__'){closeIssue(true);return}
  S.edit=false;renderDrawer(true)}
function addPerson(){const inp=$('#newPerson');const v=(inp.value||'').trim();if(!v)return;const i=cur();const p=[...(i.people||[])];if(!p.includes(v))p.push(v);inp.value='';savePatch({people:p});$('#newPerson')?.focus()}
function addSub(){const inp=$('#newSub');const v=(inp.value||'').trim();if(!v)return;const i=cur();inp.value='';savePatch({subs:[...(i.subs||[]).map(x=>({...x})),{t:v,done:false}]});$('#newSub')?.focus()}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(!e.target.closest('#meMenu,#meBtn'))$('#meMenu').classList.add('hide');
  const t=e.target.closest('button,[data-open]');if(!t)return;
  if(t.dataset.moredone){const id=t.dataset.moredone;S.doneOpen.has(id)?S.doneOpen.delete(id):S.doneOpen.add(id);render();return}
  if(t.id==='doneSecBtn'){S.doneSec=!(S.doneSec||S.status==='done');if(S.status==='done'&&!S.doneSec)S.status='';render();return}
  if(t.dataset.open){openIssue(t.dataset.open);return}
  if(t.dataset.tab){S.tab=t.dataset.tab;try{localStorage.setItem('uni-tab',S.tab)}catch(e){}render();return}
  if(t.dataset.opt){S.opt=t.dataset.opt;S.optEdit=false;renderDrawer(true);$('#drawer .db').scrollTop=0;return}
  if(t.dataset.optst){const o=curOpt();if(o)setOptState(o,t.dataset.optst);return}
  if(t.dataset.rmfile&&S.ef){const ef=S.ef,id=t.dataset.rmfile,f=ef.files.find(x=>x.id===id);ef.files=ef.files.filter(x=>x.id!==id);
    if(ef.added.includes(id)){ef.added=ef.added.filter(x=>x!==id);commitDeletes(fileRefs([f])).catch(()=>{})}else if(f)ef.removed.push(f);drawFiles();return}
  if(t.dataset.rmup&&S.ef){S.ef.up.delete(t.dataset.rmup);drawFiles();return}
  if(t.dataset.view!==undefined){const o=curOpt();if(o)openViewer(o.files.map(f=>({id:f.id,caption:o.name})),+t.dataset.view);return}
  if(t.dataset.cmpsel&&S.cmp){const c=S.cmp,id=t.dataset.cmpsel;if(c.sel.includes(id))c.sel=c.sel.filter(x=>x!==id);else{c.sel.push(id);if(c.sel.length>3)c.sel.shift()}renderCmp();return}
  if(t.dataset.cmpchoose){const o=S.options.find(x=>x.id===t.dataset.cmpchoose);if(o)setOptState(o,'chosen');return}
  if(t.dataset.cmpview){const o=S.options.find(x=>x.id===t.dataset.cmpview);if(o&&(o.files||[]).length)openViewer(o.files.map(f=>({id:f.id,caption:o.name})),0);return}
  if(t.dataset.rmlink!==undefined){t.closest('.lrow').remove();return}
  if(t.dataset.st!==undefined){S.status=S.status===t.dataset.st?'':t.dataset.st;render();return}
  if(t.dataset.v){S.view=t.dataset.v;render();return}
  if(t.dataset.setst){savePatch({status:t.dataset.setst});return}
  if(t.dataset.setpr){const p=+t.dataset.setpr;savePatch({priority:cur()?.priority===p?null:p});return}
  if(t.dataset.rmp!==undefined){const p=[...(cur().people||[])];p.splice(+t.dataset.rmp,1);savePatch({people:p});return}
  if(t.dataset.rmsub!==undefined){if(!confirm('წავშალოთ ქვეპუნქტი?'))return;const s=(cur().subs||[]).map(x=>({...x}));s.splice(+t.dataset.rmsub,1);savePatch({subs:s});return}
  if(t.dataset.rmc){if(confirm('წავშალოთ კომენტარი?'))deleteDoc(doc(db,'comments',t.dataset.rmc)).then(()=>toast('კომენტარი წაიშალა'),writeErr);return}
  if(t.classList.contains('x')){closeIssue();return}
  switch(t.id){
    case 'signIn':doSignIn();break;
    case 'signOut':signOut(auth);break;
    case 'reload':location.reload();break;
    case 'meBtn':$('#meMenu').classList.toggle('hide');break;
    case 'themeBtn':{const k=Object.keys(THEMES);theme=k[(k.indexOf(theme)+1)%k.length];try{localStorage.setItem('uni-theme',theme)}catch(e){}applyTheme();break}
    case 'fBtn':{const f=$('#filters'),o=f.classList.toggle('open');t.setAttribute('aria-expanded',o);break}
    case 'addBtn':newIssue();break;
    case 'expBtn':case 'expBtn2':exportCsv();break;
    case 'importBtn':$('#importFile').click();break;
    case 'startEdit':S.edit=true;renderDrawer(true);$('#e_title')?.focus({preventScroll:true});break;
    case 'saveEdit':saveEdit();break;
    case 'cancelEdit':cancelEdit();break;
    case 'subToggle':S.subsOpen=!S.subsOpen;renderDrawer(false);break;
    case 'addCm':addComment();break;
    case 'cmpOpen':openCmp(S.open);break;
    case 'cmpX':closeCmp();break;
    case 'addOpt':S.opt='__new__';S.optEdit=true;startEf(null);renderDrawer(true);$('#o_name')?.focus({preventScroll:true});break;
    case 'optBack':leaveOpt();break;
    case 'optEditBtn':S.optEdit=true;startEf(curOpt());renderDrawer(true);$('#o_name')?.focus({preventScroll:true});break;
    case 'optSave':saveOpt();break;
    case 'optCancel':leaveOpt();break;
    case 'addLink':{$('#links').insertAdjacentHTML('beforeend',linkRow());$('#links .lrow:last-child .lu').focus();break}
    case 'delOpt':{const o=curOpt();if(o&&confirm(`წავშალოთ ვარიანტი „${o.name}“?`)){deleteOption(o).then(()=>toast('ვარიანტი წაიშალა'),writeErr);S.opt=null;S.optEdit=false;renderDrawer(true)}break}
    case 'delIssue':{const i=cur();if(i&&confirm(`წავშალოთ საკითხი „${i.title}“, მისი კომენტარები და ვარიანტები?`)){removeIssue(i.id).then(()=>toast('საკითხი წაიშალა'),writeErr);closeIssue(true)}break}
  }
});
$('#scrim').addEventListener('click',()=>closeIssue());
document.addEventListener('keydown',e=>{
  const id=e.target.id;
  if(e.key==='Escape'&&S.cmp){closeCmp();$('#cmpOpen')?.focus();return}
  if(e.key==='Escape'&&S.open){S.edit?cancelEdit():S.opt?leaveOpt():closeIssue();return}
  if(e.key==='Enter'&&S.optEdit&&e.target.tagName==='INPUT'&&(e.target.dataset?.ok||e.target.closest?.('.lrow'))){e.preventDefault();saveOpt();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('[data-open][role=button]')){e.preventDefault();openIssue(e.target.dataset.open);return}
  if(e.key==='Enter'&&id==='newPerson'){e.preventDefault();addPerson()}
  if(e.key==='Enter'&&id==='newSub'){e.preventDefault();addSub()}
  if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)&&id==='newCm'){e.preventDefault();addComment()}
  if(e.key==='Enter'&&S.edit&&e.target.dataset?.k&&(e.target.tagName==='INPUT'||e.metaKey||e.ctrlKey)){e.preventDefault();saveEdit()}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset?.subchk!==undefined){const s=(cur().subs||[]).map(x=>({...x}));s[+el.dataset.subchk].done=el.checked;savePatch({subs:s})}
  if(el.id==='showSubs'){S.showSubs=el.checked;try{localStorage.setItem('uni-subs',el.checked?'1':'0')}catch(e){}render()}
  if(el.id==='fTopic'){S.topic=el.value;render()}
  if(el.id==='fPerson'){S.person=el.value;render()}
  if(el.id==='fPrio'){S.prio=el.value;render()}
  if(el.id==='fileIn'&&el.files.length){addFiles(el.files);el.value=''}
  if(el.id==='importFile'&&el.files[0]){importJson(el.files[0]);el.value=''}
});
let qt;$('#q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value.trim();render()},150)});

/* drop images on the editor's drop zone */
document.addEventListener('dragover',e=>{const z=e.target.closest?.('#drop');if(z&&e.dataTransfer?.types?.includes('Files')){e.preventDefault();z.classList.add('over')}});
document.addEventListener('dragleave',e=>{const z=e.target.closest?.('#drop');if(z)z.classList.remove('over')});
document.addEventListener('drop',e=>{const z=e.target.closest?.('#drop');if(z&&e.dataTransfer?.files?.length){e.preventDefault();z.classList.remove('over');addFiles(e.dataTransfer.files)}});

/* board drag & drop */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('.card');if(c){dragId=c.dataset.open;e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const col=e.target.closest?.('.col');if(col&&dragId){e.preventDefault();col.classList.add('over')}});
document.addEventListener('dragleave',e=>{const col=e.target.closest?.('.col');if(col)col.classList.remove('over')});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.col.over').forEach(c=>c.classList.remove('over'))});
function moveTo(id,st){const i=S.issues.get(id);if(i&&st&&i.status!==st){save(i.id,{status:st});render()}}
const clearOver=keep=>document.querySelectorAll('.col.over').forEach(c=>c!==keep&&c.classList.remove('over'));
document.addEventListener('drop',e=>{const col=e.target.closest?.('.col');if(col&&dragId){e.preventDefault();col.classList.remove('over');moveTo(dragId,col.dataset.col);dragId=null}});

/* touch: long-press a card (0.35 s), then drag it to another column; a quick swipe still scrolls */
let tp=null;
const colAt=(x,y)=>document.elementFromPoint(x,y)?.closest('.col');
function tpEnd(){if(!tp)return;clearTimeout(tp.timer);cancelAnimationFrame(tp.raf);tp.ghost?.remove();tp.card.classList.remove('lift');
  const b=document.querySelector('.board');if(b)b.style.scrollSnapType='';clearOver();tp=null}
function tpLoop(){ // auto-scroll the board near its edges and keep the target column highlighted
  if(!tp?.on)return;const b=document.querySelector('.board');
  if(b){const r=b.getBoundingClientRect();if(tp.x<r.left+44)b.scrollLeft-=10;else if(tp.x>r.right-44)b.scrollLeft+=10}
  const col=colAt(tp.x,tp.y);clearOver(col);col?.classList.add('over');tp.raf=requestAnimationFrame(tpLoop)}
document.addEventListener('touchstart',e=>{
  tpEnd();const c=e.target.closest?.('.card');if(!c||e.touches.length>1)return;const t=e.touches[0];
  tp={id:c.dataset.open,card:c,x:t.clientX,y:t.clientY,x0:t.clientX,y0:t.clientY,on:false};
  tp.timer=setTimeout(()=>{if(!tp)return;tp.on=true;navigator.vibrate?.(15);
    const r=c.getBoundingClientRect(),g=c.cloneNode(true);g.className='card ghost';g.removeAttribute('data-open');g.style.width=r.width+'px';
    tp.dx=tp.x-r.left;tp.dy=tp.y-r.top;g.style.transform=`translate(${r.left}px,${r.top}px)`;document.body.appendChild(g);tp.ghost=g;c.classList.add('lift');
    const b=document.querySelector('.board');if(b)b.style.scrollSnapType='none';tpLoop()},350);
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!tp)return;const t=e.touches[0];
  if(!tp.on){if(Math.hypot(t.clientX-tp.x0,t.clientY-tp.y0)>10)tpEnd();return}
  e.preventDefault();tp.x=t.clientX;tp.y=t.clientY;tp.ghost.style.transform=`translate(${tp.x-tp.dx}px,${tp.y-tp.dy}px)`;
},{passive:false});
document.addEventListener('touchend',e=>{if(!tp)return;if(tp.on){e.preventDefault();moveTo(tp.id,colAt(tp.x,tp.y)?.dataset.col)}tpEnd()});
document.addEventListener('touchcancel',tpEnd);
document.addEventListener('contextmenu',e=>{if(tp&&e.target.closest?.('.card'))e.preventDefault()});

/* CSV export (UTF-8 with BOM for Excel) */
function exportCsv(){
  const head=['№','თემა','საკითხი','აღწერა','პრიორიტეტი','სტატუსი','შენიშვნა','პირები','ქვეპუნქტები','კომენტარები'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=topicsList().flatMap(t=>all().filter(i=>(i.topic||'სხვა')===t).sort(byN)).map(i=>[i.n,i.topic,i.title,i.desc,i.priority?i.priority+'. '+PRF[i.priority]:'',STL[i.status],i.note,(i.people||[]).join(', '),
    (i.subs||[]).map(s=>(s.done?'[x] ':'[ ] ')+s.t).join('\n'),commentsOf(i.id).map(c=>`${c.authorName||c.authorEmail} (${fmt(c.ts)}): ${c.text}`).join('\n')]);
  const csv='﻿'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='UNI_Mixed-Use_საკითხები.csv';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* ---------- boot ---------- */
if(!firebaseConfig||!firebaseConfig.apiKey||firebaseConfig.apiKey.startsWith('PASTE')){gate('config')}
else{
  const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);initMedia({db,getUser:()=>S.user});
  onAuthStateChanged(auth,u=>{stopListeners();S.user=u;if(!u){gate('signin');return}gate('loading');startListeners()});
}
